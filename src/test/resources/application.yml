spring:
  config:
    import: optional:aws-secretsmanager:/
  batch:
    job:
      enabled: false
  cloud:
    aws:
      region:
        static: eu-west-3

logging:
  level:
    io:
      awspring:
        cloud: debug

app:
  sqs:
    weather-summary-topic: loom-etl-queue
  weather-api:
    root-uri: "http://localhost:8082"
  s3:
    output-path: s3://etl-weather/output/test.csv
